<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>任务提醒</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/phosphor/style.css" />
    <script src="/vendor/echarts.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main id="login-view" class="login-container" hidden>
      <section class="login-panel">
        <div class="panel login-panel-card">
          <div class="login-brand-mark">
            <i class="ph ph-bell-ringing login-brand-icon" aria-hidden="true"></i>
          </div>
          <div class="login-header">
            <span class="login-kicker">Task Reminder Console</span>
            <h1>任务提醒</h1>
            <p class="login-subtitle">登录后即可管理任务、查看状态并测试发送通道。</p>
          </div>
          <form id="login-form" class="form-grid login-form">
            <label>
              <span><i class="ph ph-user" aria-hidden="true"></i> 账号</span>
              <input
                name="username"
                autocomplete="username"
                required
                maxlength="100"
                placeholder="请输入账号"
                autofocus
              />
              <small class="help-text">请输入当前系统管理员账号。</small>
            </label>
            <label>
              <span><i class="ph ph-lock-key" aria-hidden="true"></i> 密码</span>
              <div class="password-field">
                <input
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  maxlength="1024"
                  placeholder="请输入密码"
                />
                <button
                  type="button"
                  id="password-toggle"
                  class="password-toggle"
                  aria-label="显示密码"
                  aria-pressed="false"
                >
                  <i class="ph ph-eye" aria-hidden="true"></i>
                </button>
              </div>
              <small class="help-text">如需重置密码，请在设置页修改。</small>
            </label>
            <p id="login-error" class="error" role="alert"></p>
            <button class="primary" type="submit">
              <i class="ph ph-sign-in" aria-hidden="true"></i> 登录
            </button>
          </form>
        </div>
      </section>
    </main>
    <div id="app-view" hidden>
      <aside class="sidebar">
        <a href="/" data-page="dashboard" class="sidebar-brand"
          ><span class="brand-mark"><i class="ph ph-bell-ringing" aria-hidden="true"></i></span
          ><span class="brand-text">任务提醒</span></a
        >
        <nav class="sidebar-nav" aria-label="主导航">
          <a href="/" data-page="dashboard"
            ><i class="ph ph-squares-four" aria-hidden="true"></i><span>仪表盘</span></a
          >
          <a href="/tasks" data-page="tasks"
            ><i class="ph ph-list-checks" aria-hidden="true"></i><span>任务管理</span></a
          >
          <a href="/groups" data-page="groups"
            ><i class="ph ph-folders" aria-hidden="true"></i><span>分组管理</span></a
          >
          <a href="/calendar" data-page="calendar"
            ><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>日历</span></a
          >
          <a href="/monitoring" data-page="monitoring"
            ><i class="ph ph-waveform" aria-hidden="true"></i><span>运行监控</span></a
          >
          <a href="/settings" data-page="settings"
            ><i class="ph ph-gear" aria-hidden="true"></i><span>设置</span></a
          >
        </nav>
        <div class="sidebar-foot">
          <button id="logout" class="logout-btn">
            <i class="ph ph-sign-out" aria-hidden="true"></i><span>退出登录</span>
          </button>
        </div>
      </aside>
      <header class="topbar">
        <h1><i class="ph ph-bell-ringing" aria-hidden="true"></i> 任务提醒</h1>
        <button
          id="mobile-menu"
          class="hamburger-menu"
          aria-label="菜单"
          aria-expanded="false"
          aria-controls="mobile-nav"
        >
          <span></span><span></span><span></span>
        </button>
      </header>
      <nav id="mobile-nav" class="mobile-nav" aria-label="移动端导航">
        <a href="/" data-page="dashboard"
          ><i class="ph ph-squares-four" aria-hidden="true"></i>仪表盘</a
        >
        <a href="/tasks" data-page="tasks"
          ><i class="ph ph-list-checks" aria-hidden="true"></i>任务管理</a
        >
        <a href="/groups" data-page="groups"
          ><i class="ph ph-folders" aria-hidden="true"></i>分组管理</a
        >
        <a href="/calendar" data-page="calendar"
          ><i class="ph ph-calendar-blank" aria-hidden="true"></i>日历</a
        >
        <a href="/monitoring" data-page="monitoring"
          ><i class="ph ph-waveform" aria-hidden="true"></i>运行监控</a
        >
        <a href="/settings" data-page="settings"
          ><i class="ph ph-gear" aria-hidden="true"></i>设置</a
        >
        <button id="mobile-logout" class="logout-btn">
          <i class="ph ph-sign-out" aria-hidden="true"></i>退出登录
        </button>
      </nav>
      <main id="main" class="container" tabindex="-1"><p class="loading">正在加载…</p></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
